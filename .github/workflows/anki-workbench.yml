name: Anki Workbench

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Pin the tested Anki installer fix until the next Workbench PyPI release.
  WORKBENCH_REF: "de1aa35f9510d0c78d89e915d5ddfcaa634e6343"

jobs:
  deck-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install system media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin
      - name: Install Anki Workbench
        run: |
          npm install -g sfw
          sfw uv pip install --system --exclude-newer "7 days" "anki-addon-workbench[gui] @ git+https://github.com/ritornello-labs/anki-addon-workbench.git@${WORKBENCH_REF}"
      - name: Build APKGs and run disposable Anki smoke
        run: make UV="uv" workbench-smoke
